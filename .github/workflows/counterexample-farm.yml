name: CEREBRON Collatz Farm 04 Counterexample C256

on:
  push:
    paths:
      - '.github/workflows/counterexample-farm.yml'
      - 'mission/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          R=[
          ('COUNTEREXAMPLE_HUNTER_A','llama3b','llama-3.2','construct adversarial valuation words'),
          ('COUNTEREXAMPLE_HUNTER_B','gemma9b','gemma-2','independent adversarial families'),
          ('UNIFORM_BOUND_ATTACKER','llama3b','llama-3.2','attack every claimed uniform bound'),
          ('STURMIAN_ADVERSARY','gemma9b','gemma-2','phase shifts and return-word edge cases'),
          ('ADIC_ADVERSARY','llama3b','llama-3.2','attack 2-adic and 3-adic obstructions'),
          ('CRT_ADVERSARY','gemma9b','gemma-2','find CRT compatibility loopholes'),
          ('ARCHIMEDEAN_ADVERSARY','gemma9b','gemma-2','seek positive-width windows that survive'),
          ('DYNAMICS_ADVERSARY','llama3b','llama-3.2','long first-return and excursion constructions'),
          ('ONE_CROSSING_SPECIALIST','gemma9b','gemma-2','floor/ceil one-crossing family'),
          ('NEAR_RESONANCE_SPECIALIST','llama3b','llama-3.2','continued-fraction near-resonances'),
          ('COMPUTATIONAL_FALSIFIER','llama3b','llama-3.2','finite tests to falsify only'),
          ('LEMMA_BREAKER','gemma9b','gemma-2','find first false implication in proposed lemmas'),
          ('ASYMPTOTIC_AUDITOR','gemma9b','gemma-2','attack O(1), limits and uniformity'),
          ('QUANTIFIER_AUDITOR','gemma9b','gemma-2','attack forall/exists switches'),
          ('CONSTRUCTIVE_CREATOR_A','llama3b','llama-3.2','construct surviving family'),
          ('CONSTRUCTIVE_CREATOR_B','gemma9b','gemma-2','independent surviving family'),
          ('VERIFIER','gemma9b','gemma-2','verify strongest counterexample claim'),
          ('COUNTER_AUDITOR','llama3b','llama-3.2','attack the alleged counterexample'),
          ('SYNTHESIZER','gemma9b','gemma-2','merge only verified failures'),
          ('JUDGE','gemma9b','gemma-2','classify REFUTED/HOLD/PROVED per lemma')]
          print('matrix='+json.dumps({'include':[{'role':r,'model_id':m,'family':f,'focus':x} for r,m,f,x in R]},separators=(',',':')))
          PY

  adversary-agent:
    needs: plan
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install --quiet hf-gradio
      - name: Execute adversarial agent
        env:
          ROLE: ${{ matrix.role }}
          MODEL_ID: ${{ matrix.model_id }}
          FAMILY: ${{ matrix.family }}
          FOCUS: ${{ matrix.focus }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python - <<'PY'
          import json,os,importlib.util,hashlib
          from pathlib import Path
          spec=importlib.util.spec_from_file_location('fw','worker/farm_worker.py'); fw=importlib.util.module_from_spec(spec); spec.loader.exec_module(fw)
          reg={'llama3b':'huggingface-projects/llama-3.2-3B-Instruct','gemma9b':'huggingface-projects/gemma-2-9b-it'}
          role=os.environ['ROLE']; mid=os.environ['MODEL_ID']; fam=os.environ['FAMILY']; focus=os.environ['FOCUS']
          mission=Path('mission/C256-COUNTEREXAMPLE-FARM.md').read_text()
          prompt=f'''CEREBRON OMEGA — COLLATZ FARM 04 COUNTEREXAMPLE\nROLE: {role}\nFOCUS: {focus}\n\n{mission}\n\nRULES: REALITY>COHERENCE; CLAIM<=EVIDENCE; finite test != proof; counterexample to a lemma != counterexample to Collatz; never invent computations. Return CLAIM ATTACKED / CONSTRUCTION / VERIFICATION / STATUS / IMPACT.'''
          ok,text,meta=fw.invoke(reg[mid],prompt)
          result={'schema':'cerebron-counterexample-farm-c256-v1','role':role,'model_id':mid,'model_family':fam,'ok':bool(ok),'response':text if ok else None,'response_sha256':hashlib.sha256(text.encode()).hexdigest() if ok and text else None,'meta':meta,'evidence_status':'UNREVIEWED_EXTERNAL_AGENT_OUTPUT' if ok else 'NO_EXTERNAL_OUTPUT'}
          Path('out/result.json').write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: counterexample-c256-${{ matrix.role }}
          path: out/result.json
          retention-days: 14

  omega-fusion:
    needs: adversary-agent
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: counterexample-c256-*
          path: results
          merge-multiple: false
      - shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          rows=[]
          for p in Path('results').rglob('result.json'):
            try: rows.append(json.loads(p.read_text()))
            except: pass
          ok=[r for r in rows if r.get('ok')]
          Path('counterexample-c256-accounting.json').write_text(json.dumps({'schema':'cerebron-counterexample-c256-omega-v1','artifact_rows':len(rows),'successful_external_ai_calls':len(ok),'successful_model_families':sorted({r.get('model_family') for r in ok}),'successful_roles':sorted({r.get('role') for r in ok}),'claim_note':'Unaudited until Master Hub verification.'},ensure_ascii=False,indent=2)+'\n')
          Path('counterexample-c256-packet.txt').write_text('\n\n'.join('ROLE '+str(r.get('role'))+' | '+str(r.get('model_family'))+'\n'+str(r.get('response') or '') for r in ok))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: counterexample-c256-omega-packet
          path: |
            counterexample-c256-accounting.json
            counterexample-c256-packet.txt
          retention-days: 14
